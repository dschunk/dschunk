name: Website health check

on:
  push:
    paths:
      - ".github/workflows/site-health.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: DavidSchunk.com
            url: https://www.davidschunk.com/
          - site: DavidSchunk.com Health
            url: https://www.davidschunk.com/__health
            json_health: true
          - site: Everyday IT Tips
            url: https://everydayittips.com/
          - site: TicketReady download article
            url: https://everydayittips.com/articles/ticketready-free-windows-support-report/
          - site: TicketReady landing page
            url: https://www.davidschunk.com/tools/ticketready
          - site: Entra Connect field guide
            url: https://everydayittips.com/guides/entra-connect-sync-error-troubleshooting/
          - site: Exchange shared mailbox field guide
            url: https://everydayittips.com/guides/exchange-online-shared-mailbox-audit/
          - site: Windows DNS registration field guide
            url: https://everydayittips.com/guides/windows-dns-dynamic-registration-troubleshooting/
          - site: Voice of Adoptees
            url: https://voiceofadoptees.com/
          - site: Voice of Adoptees Worker Health
            url: https://voiceofadoptees.com/api/health
            json_health: true
          - site: Russian Adoptees Organization
            url: https://russianadoptees.com/
          - site: Russian Adoptees Organization Health
            url: https://russianadoptees.com/api/health
            json_health: true
            required_true_fields: caseStoreConfigured,emailBindingConfigured,contactDestinationConfigured,orphanageStaffDestinationConfigured
          - site: DoTheyPass
            url: https://dotheypass.com/
          - site: DoTheyPass Health
            url: https://dotheypass.com/api/health
            json_health: true
          - site: BHS 2013
            url: https://bhs2013.com/
          - site: Capital State RP
            url: https://capitalstaterp.com/
          - site: Capital State Admin
            url: https://admin.capitalstaterp.com/
          - site: Department of Cash
            url: https://departmentofcash.com/
          - site: Yua the Cat
            url: https://yuathecat.com/

    steps:
      - name: Check public endpoint
        shell: bash
        run: |
          set -euo pipefail

          url="${{ matrix.url }}"
          echo "Checking $url"

          body_file="$(mktemp)"
          code="$(
            curl               --silent               --show-error               --output "$body_file"               --write-out "%{http_code}"               --connect-timeout 10               --max-time 25               --location               --max-redirs 5               --retry 2               --retry-delay 2               --retry-all-errors               --user-agent "SchunkOps-SiteHealth/1.0"               "$url" || true
          )"

          echo "HTTP status: $code"

          if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
            if [[ "${{ matrix.json_health || false }}" == "true" ]]; then
              python -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if payload.get("ok") is True else "health JSON did not report ok=true")' "$body_file"
              required_fields="${{ matrix.required_true_fields || '' }}"
              if [[ -n "$required_fields" ]]; then
                python -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); fields=[x for x in sys.argv[2].split(",") if x]; missing=[x for x in fields if payload.get(x) is not True]; raise SystemExit(0 if not missing else "health JSON fields not true: " + ", ".join(missing))' "$body_file" "$required_fields"
              fi
            fi
            echo "${{ matrix.site }} is reachable and passed its health check."
            echo "✅ **${{ matrix.site }}** — HTTP $code (verified response)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$code" == "403" ]]; then
            echo "::warning::${{ matrix.site }} returned HTTP 403 to the monitoring runner; health is NOT verified (possibly WAF/bot protection)."
            echo "⚠️ **${{ matrix.site }}** — HTTP 403; health unverified (investigate WAF/bot handling)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "❌ **${{ matrix.site }}** — HTTP $code; probe failed" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Health check failed for ${{ matrix.site }} ($url): HTTP $code"
          exit 1
