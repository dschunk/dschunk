<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">David Schunk — Senior IT Engineer</title>
  <desc id="desc">Professional dark navy banner focused on Windows infrastructure, automation, operations, and technical writing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="300" rx="4" fill="#4f8f77"/>

  <text x="70" y="78" fill="#91b9aa" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">WINDOWS INFRASTRUCTURE · AUTOMATION · OPERATIONS · TECHNICAL WRITING</text>
  <text x="68" y="155" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="750">David Schunk</text>
  <text x="70" y="202" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">Senior IT Engineer</text>

  <line x1="70" y1="230" x2="1130" y2="230" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="70" y="263" fill="#aeb9c6" font-family="Segoe UI, Arial, sans-serif" font-size="16">Practical systems. Clear documentation. Reusable tools. Built for the next engineer.</text>
</svg>