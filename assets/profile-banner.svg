<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">David Schunk — Senior IT Engineer</title>
  <desc id="desc">Navy and gold infrastructure-themed profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2b4c"/>
      <stop offset="1" stop-color="#123f68"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="35%" r="55%">
      <stop offset="0" stop-color="#d6ad2b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d6ad2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <path d="M0 266 C240 222 372 307 622 257 S1000 210 1200 249 V320 H0Z" fill="#06101e" opacity="0.72"/>
  <path d="M0 278 C240 234 385 320 635 270 S1000 222 1200 260" fill="none" stroke="#d6ad2b" stroke-width="2" opacity="0.75"/>

  <g opacity="0.42" stroke="#5fa8d3" stroke-width="2" fill="#0b2b4c">
    <path d="M800 82 L925 48 L1040 100 L1110 54 M925 48 L960 165 L1040 100 L1126 176 M800 82 L854 182 L960 165 L1048 245 M854 182 L742 229"/>
    <circle cx="800" cy="82" r="8"/><circle cx="925" cy="48" r="8"/><circle cx="1040" cy="100" r="8"/>
    <circle cx="1110" cy="54" r="8"/><circle cx="960" cy="165" r="8"/><circle cx="1126" cy="176" r="8"/>
    <circle cx="854" cy="182" r="8"/><circle cx="1048" cy="245" r="8"/><circle cx="742" cy="229" r="8"/>
  </g>
  <g fill="#d6ad2b" opacity="0.95">
    <circle cx="925" cy="48" r="4"/><circle cx="960" cy="165" r="4"/><circle cx="1048" cy="245" r="4"/>
  </g>

  <g filter="url(#shadow)">
    <text x="72" y="92" fill="#d6ad2b" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5">INFRASTRUCTURE · AUTOMATION · OPERATIONS</text>
    <text x="68" y="170" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="750">DAVID SCHUNK</text>
    <text x="72" y="213" fill="#c9d7e5" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">Senior IT Engineer · Builder · Writer</text>
    <text x="72" y="273" fill="#ffffff" font-family="Georgia, serif" font-size="22" font-style="italic">“Build it like you won’t be there tomorrow.”</text>
  </g>
